# Nginx config for WebChat — aniksutradhar.com
# Use this when routing through Cloudflare Tunnel pointing to localhost:80

server {
    listen 8080;
    server_name webchat.aniksutradhar.com;

    # Gzip for faster loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ── 1. Auth API (/api/auth/*) → container port 6001 ──────────────────────
    location /api/auth/ {
        proxy_pass         http://localhost:6001/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── 2. WebSocket (/ws) → container port 6002 ────────────────────────────────
    location /ws {
        proxy_pass         http://localhost:6002/ws;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    # ── 3. Chat API (/api/*) → container port 6002 ──────────────────────────────
    location /api/ {
        proxy_pass         http://localhost:6002/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── 4. Frontend (Next.js) → container port 6000 ─────────────────────────────
    location / {
        proxy_pass         http://localhost:6000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
