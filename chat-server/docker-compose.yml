version: '3.8'

services:
  server:
    build: .
    ports:
      - "6002:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@db:5432/chatdb
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./app:/usr/src/app/app
    restart: always

  auth_server:
    build: ../auth-server
    ports:
      - "6001:8001"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@db:5432/chatdb
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - FRONTEND_URL=http://localhost:6000
      - AUTH_SERVER_URL=http://localhost:6001
      - RESEND_API_KEY=${RESEND_API_KEY}
      - SMTP_FROM=${SMTP_FROM:-noreply@webchat.aniksutradhar.com}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../auth-server/app:/usr/src/app/app
    restart: always

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: chatdb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  client:
    build:
      context: ../chat-client
      args:
        - NEXT_PUBLIC_AUTH_API_URL=http://localhost:6001/api
        - NEXT_PUBLIC_CHAT_API_URL=http://localhost:6002/api
        - NEXT_PUBLIC_WS_URL=ws://localhost:6002
    ports:
      - "6000:3000"
    environment:
      - NEXT_PUBLIC_AUTH_API_URL=http://localhost:6001/api
      - NEXT_PUBLIC_CHAT_API_URL=http://localhost:6002/api
      - NEXT_PUBLIC_WS_URL=ws://localhost:6002
    depends_on:
      - auth_server
      - server
    restart: always

volumes:
  postgres_data:
  redis_data:
